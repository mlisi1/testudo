# Example Testudo configuration.
#
# Only `topics`, `actions`, and `tf` need entries specific to your robot.
# Any topic you don't declare here still gets the vitals tier (liveness +
# frequency) automatically. A topic you *do* declare, whose message type a
# discovered plugin covers, also gets that plugin's content checks -- with
# thresholds merged over the plugin's own defaults, so you only need to
# override the metrics you actually want to change.
#
# Exception: sensor_msgs/msg/Image, sensor_msgs/msg/CompressedImage,
# sensor_msgs/msg/PointCloud2, and theora_image_transport/msg/Packet
# topics default to presence-only (a publisher exists, but nothing
# subscribes) unless declared here -- even a raw vitals subscription to
# camera/point-cloud data is heavy enough to compete with the driver/
# pipeline actually producing it, and for a lazy image_transport
# republisher, subscribing can wake up an otherwise-idle encoder. Declare
# a topic of one of these types under `topics:` (see below) to get real
# liveness + that plugin's content checks for it. Nothing needs to go
# under `exclude_topics:` below just for this -- it's already the default.

severity_mode: worst  # worst | weighted | both

publish:
  rate_hz: 5.0
  topic: /diagnostics

# Optional: a directory of light-path plugin files (see plugins/base.py and
# the plugin-authoring guide once it exists). Relative paths are resolved
# from the current working directory.
# plugins_dir: ./my_plugins

topics:
  nav_msgs/msg/Odometry:
    - name: /odom
      weight: 2
      # cmd_vel cross-check: OdometryPlugin looks this up by the logical
      # name "cmd_vel" to compare commanded vs. reported motion.
      related_topics:
        cmd_vel: /cmd_vel
      thresholds:
        # This robot's EKF is noisier than the plugin default tolerates.
        position_covariance_trace:
          green: 0.02
          orange: 0.2
        # ...but heading precision matters more here, so tighten yaw.
        yaw_variance:
          green: 0.005
          orange: 0.05
        # covariance_growth_rate isn't overridden: the plugin default applies.

  sensor_msgs/msg/LaserScan:
    - name: /scan
      weight: 1
      thresholds:
        # A rough outdoor lidar returns more out-of-range readings than
        # the plugin's indoor-tuned default tolerates.
        invalid_ratio:
          green: 0.02
          orange: 0.1

  sensor_msgs/msg/Imu:
    - name: /imu/data
      weight: 1
      thresholds:
        # A frozen IMU is a serious fault on this robot -- flag it fast.
        stuck_count:
          green: 1
          orange: 5

  # ImageStreamPlugin covers both sensor_msgs/msg/Image and
  # sensor_msgs/msg/CompressedImage -- declare whichever one your driver
  # actually publishes.
  sensor_msgs/msg/CompressedImage:
    - name: /camera/image_raw/compressed
      weight: 1
      thresholds:
        # This camera's bitrate is naturally spiky (auto-exposure changes),
        # so only flag a much steeper drop than the plugin default.
        size_drop_ratio:
          green: 0.4
          orange: 0.15

  sensor_msgs/msg/NavSatFix:
    - name: /gps/fix
      weight: 2
      thresholds:
        # This receiver is consumer/SBAS-grade, not RTK -- a few meters of
        # std per axis is normal here, well past the plugin's RTK-tuned
        # default (green=1e-4, orange=0.01 m^2).
        position_covariance:
          green: 1.0
          orange: 9.0
        # ...but under the canopy on this site, losing fix for a couple of
        # readings in twenty is normal; only flag heavier dropout than that.
        fix_dropout_ratio:
          green: 0.15
          orange: 0.35
        # stuck_count, invalid_ratio, and jump_speed_mps aren't overridden:
        # the plugin defaults apply.

  # Costmap/planner/controller actual-vs-configured rate: no dedicated
  # plugin needed for this -- any declared topic's vitals-tier rate gets
  # checked against `rate_hz` if it's set (lower is worse). This costmap
  # is configured to update at 5 Hz; falling much below that means the
  # controller isn't keeping up.
  nav_msgs/msg/OccupancyGrid:
    - name: /local_costmap/costmap
      weight: 2
      thresholds:
        rate_hz:
          green: 4.0
          orange: 1.0

  # BehaviorTreeLogPlugin: currently-active BT node(s) plus trigger
  # frequency for recovery nodes wired directly into the tree (e.g.
  # ClearEntireCostmap) -- the ones the recovery actions below can't see,
  # since they're a synchronous service call, not their own action server.
  nav2_msgs/msg/BehaviorTreeLog:
    - name: /behavior_tree_log
      weight: 1
      thresholds:
        recovery_frequency_per_min:
          green: 2.0
          orange: 6.0

actions:
  - name: navigate_to_pose
    action_type: nav2_msgs/action/NavigateToPose
    weight: 3
    # NavigateToPose's Feedback carries distance_remaining and
    # estimated_time_remaining; Nav2GoalPlugin reads them off this topic on
    # a best-effort basis (most other actions' Feedback doesn't have them).
    related_topics:
      feedback: /navigate_to_pose/_action/feedback
    thresholds:
      success_rate:
        green: 0.9
        orange: 0.7

  # Recovery-behavior frequency, via the same action-tracking mechanism as
  # navigate_to_pose above. A high spin rate usually means the planner
  # keeps getting stuck, not that spinning itself is the problem. This only
  # covers recovery behaviors that are their own action server -- see
  # BehaviorTreeLogPlugin above for recovery nodes that aren't.
  - name: spin
    action_type: nav2_msgs/action/Spin
    weight: 1
    thresholds:
      frequency_per_min:
        green: 2.0
        orange: 6.0

tf:
  - parent: map
    child: odom
  - parent: odom
    child: base_link

# Per-process CPU/memory/GPU profiling -- every ROS node Testudo can
# resolve to an OS process, plus Testudo's own process. Published on its
# own topic (publish_topic), separate from the topic/TF/Nav2 diagnostics
# above. There's no reliable API mapping a ROS node name to a PID, so
# resolution is best-effort (an exact match via a `__node:=` launch remap,
# falling back to "executable name == node's bare name"); a process that
# can't be attributed to a specific node still shows up, labeled by its OS
# process name instead. Not available during `replay` (no live OS process
# to sample).
# node_profiling:
#   enabled: true
#   poll_interval_seconds: 2.0
#   gpu_enabled: true   # NVIDIA + pynvml only; silently unavailable otherwise
#   publish_topic: /diagnostics/nodes
#   publish_rate_hz: 1.0
#   cpu_percent:
#     # psutil's cpu_percent can exceed 100% for a multi-threaded process
#     # (matches top/htop) -- these are generous on purpose.
#     green: 150
#     orange: 300
#   memory_mb:
#     green: 500
#     orange: 1500
#   ctx_switches_per_sec:
#     # The *involuntary* context-switch rate -- the OS scheduler preempting
#     # a process against its will -- is the direct "is this node being
#     # starved of CPU time" signal, distinct from cpu_percent: a starved
#     # node's CPU% can look normal (it isn't getting time to *use* the
#     # CPU). A *voluntary* switch (blocking on IPC, most of a healthy
#     # node's switches) isn't counted, so these can stay conservative.
#     green: 50
#     orange: 200
#   exclude_nodes:
#     - /some_noisy_diagnostic_only_node

# A plain string is a literal (exact-name) rule; a mapping opts into a
# regex searched against the topic name instead (`type: regex` -- `^`/`$`
# anchor a starts-with/ends-with check, unanchored matches anywhere).
# A matching topic gets no subscription of any kind -- just a name-only
# row in the TUI's "Excluded Topics" category. Useful for a topic whose
# interface package isn't installed on this host (a `ModuleNotFoundError`
# at subscribe time otherwise), or one you have no diagnostic interest in
# either way. Empty by default -- nothing needs to be here out of the box;
# rules added live from the TUI's Options screen (`o`) are appended here
# automatically.
# exclude_topics:
#   - /velodyne_packets
#   - pattern: "_debug$"
#     type: regex
#   - /rtabmap/**

exclude_topics:
- pattern: ^/filter
  type: regex
