site_name: Testudo
site_description: Black-box diagnostics for ROS 2 navigation stacks, live in the terminal or from a bag.
site_url: https://mlisi1.github.io/testudo/
repo_url: https://github.com/mlisi1/testudo
repo_name: mlisi1/testudo
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 mlisi1

theme:
  name: material
  language: en
  logo: logo.svg
  favicon: logo.svg
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.action.edit

extra_css:
  - assets/css/extra.css

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets:
      base_path: [docs/includes]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

exclude_docs: |
  /gen/
  /includes/
  /requirements.txt

validation:
  links:
    anchors: warn
    unrecognized_links: warn

nav:
  - Home: index.md
  - Getting started:
      - getting-started/index.md
      - Bring up a robot: getting-started/bring-up.md
      - Investigate a bag: getting-started/replay.md
      - Write a config: getting-started/config-init.md
      - Use it in CI: getting-started/ci.md
      - Run headless: getting-started/headless.md
  - Dashboard:
      - tui/index.md
      - Keys: tui/keys.md
      - Quick actions: tui/quick-actions.md
      - Options: tui/options.md
      - Replay scrubbing: tui/replay.md
  - Plugins:
      - plugins/index.md
      - Localization: plugins/localization.md
      - IMU: plugins/imu.md
      - GNSS: plugins/gnss.md
      - Image stream: plugins/image-stream.md
      - Point stream: plugins/point-stream.md
      - Velocity command: plugins/velocity-command.md
      - Costmap: plugins/costmap.md
      - Actions: plugins/actions.md
      - Behavior tree log: plugins/bt-log.md
      - TF watch: plugins/tf-watch.md
  - Concepts:
      - concepts/index.md
      - Monitoring tiers: concepts/tiers.md
      - Severity and zones: concepts/severity.md
      - Liveness: concepts/liveness.md
      - Debouncing: concepts/hysteresis.md
      - Faults: concepts/faults.md
  - Core checks:
      - core-checks/index.md
      - Liveness: core-checks/live.md
      - Stamps: core-checks/stamp.md
      - Check failures: core-checks/check.md
      - Node profiling: core-checks/node.md
  - Reference:
      - reference/index.md
      - All codes: reference/codes.md
      - Configuration: reference/config.md
      - Command line: reference/cli.md
      - Published topics: reference/topics.md
      - Faults topic schema: reference/faults-schema.md
  - Developers:
      - developers/index.md
      - Write a plugin: developers/plugin-guide.md
      - Plugin API: developers/api.md
      - Architecture: developers/architecture.md
      - Contributing: developers/contributing.md
