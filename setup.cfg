[develop]
script_dir=$base/lib/testudo
[install]
install_scripts=$base/lib/testudo

[tool:pytest]
# Default python_classes=Test* misfires on domain classes like TestudoClock/
# TestudoConfig; all tests here are function-based, so narrow it instead of
# renaming project types to dodge a collector heuristic.
python_classes = Test*Case
